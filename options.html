<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Godspeed Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #1f2937;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #374151;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    
    button {
      background-color: #3b82f6;
      color: white;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #2563eb;
    }
    
    button:active {
      background-color: #1d4ed8;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    
    .status.success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>
  <h1>Godspeed Extension Settings</h1>
  
  <form id="settings-form">
    <div class="form-group">
      <label for="apiKey">API Key *</label>
      <input type="password" id="apiKey" placeholder="Enter your Godspeed API key" required>
      <div class="help-text">Your API key is used as the Bearer token for authentication</div>
    </div>
    
    <div class="form-group">
      <label for="listId">List ID (optional)</label>
      <input type="text" id="listId" placeholder="Enter list ID (leave blank if not needed)">
      <div class="help-text">If specified, tasks will be added to this list</div>
    </div>
    
    <button type="submit">Save Settings</button>
    
    <div id="status" class="status"></div>
  </form>
  
  <script src="options.js"></script>
</body>
</html>
