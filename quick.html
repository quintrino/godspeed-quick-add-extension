<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add to Godspeed</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { display: flex; align-items: center; padding: 0 12px; box-sizing: border-box;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #ffffff; color: #111827; }
    input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 18px;
            border: 1px solid #d1d5db; border-radius: 10px; outline: none;
            background: #ffffff; color: #111827; }
    @media (prefers-color-scheme: dark) {
      body, input { background: #1f2937; color: #f9fafb; }
      input { border-color: #4b5563; }
    }
  </style>
</head>
<body>
  <input id="text" type="text" autocomplete="off" autofocus
         placeholder="Add to Godspeed &mdash; Enter to save, Esc to cancel">
  <script src="quick.js"></script>
</body>
</html>
